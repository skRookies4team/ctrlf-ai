# =============================================================================
# 확장 설정
# =============================================================================

settings:
  # 확장 적용 조건
  max_query_length: 40          # 이보다 긴 쿼리는 확장 안 함
  min_expansion_keywords: 3     # 최소 확장 키워드 수
  max_expansion_keywords: 8     # 최대 확장 키워드 수

  # 확장 방식
  include_original: true        # 원본 쿼리 포함
  include_synonyms: true        # 동의어 포함
  include_related: true         # 관련어 포함

  # 우선순위 (숫자가 낮을수록 높은 우선순위)
  priority:
    original: 1
    synonyms: 2
    related: 3
