# =============================================================================
# Query Expansion Rules - Phase 58
# =============================================================================
#
# RAG 검색 품질 향상을 위한 쿼리 확장 규칙
# 짧은 쿼리를 동의어/관련어로 확장하여 검색 재현율 향상
#
# 구조:
#   keyword:
#     domain: 검색 도메인 (POLICY, EDU, INCIDENT)
#     synonyms: 동의어 (같은 의미의 다른 표현)
#     related: 관련어 (함께 검색하면 좋은 키워드)
#
# 사용:
#   "연차" 검색 시 → "연차 연차휴가 연간휴가 휴가 사용 규정 신청"
#
# =============================================================================

version: "1.0"
description: "Query Expansion Rules for RAG Search"
created_at: "2026-01-08"
total_keywords: 20

