# =============================================================================
# ctrlf-ai Docker Compose 설정 (REAL ONLY)
#
# ⚠️ NOTE
# - mock / profile / extends 기반 구조는 초기 통합 테스트용 설계
# - 현재는 REAL 환경에서 LLMOps / Observability 검증에 집중
# - mock 관련 서비스는 제거하되, 주석은 설계 이력 보존용으로 유지
#
# 사용법 (REAL):
#   export RAGFLOW_BASE_URL_REAL=...
#   export LLM_BASE_URL_REAL=...
#   export BACKEND_BASE_URL_REAL=...
#   docker compose up -d --build
# =============================================================================

services:
  # =============================================================================
  # AI Gateway (REAL)
  # =============================================================================
  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctrlf-ai-gateway
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ctrlf-ai-gateway
      - APP_ENV=docker
      - LOG_LEVEL=DEBUG
      - AI_ENV=real

      # Elasticsearch (Logs / Search)
      - ELASTICSEARCH_URL=http://elasticsearch:9200

      # ===============================
      # REAL External Dependencies
      # ===============================
      - MILVUS_ENABLED=true
      - MILVUS_HOST=${MILVUS_HOST:-58.127.241.84}
      - MILVUS_PORT=${MILVUS_PORT:-19540}
      - MILVUS_COLLECTION_NAME=${MILVUS_COLLECTION_NAME:-ragflow_chunks_openai}

      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBED_MODEL=text-embedding-3-large
      - OPENAI_EMBED_DIM=3072
      - EMBEDDING_DIMENSION=3072

      - RAGFLOW_BASE_URL_REAL=${RAGFLOW_BASE_URL_REAL}
      - LLM_BASE_URL_REAL=${LLM_BASE_URL_REAL}
      - BACKEND_BASE_URL_REAL=${BACKEND_BASE_URL_REAL}
      - RAGFLOW_API_KEY=${RAGFLOW_API_KEY}
      - BACKEND_INTERNAL_TOKEN=${BACKEND_INTERNAL_TOKEN}

    networks:
      - ctrlf-net

    depends_on:
      elasticsearch:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Elasticsearch
  # =============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: ctrlf-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    networks:
      - ctrlf-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]

  # =============================================================================
  # Prometheus (Metrics)
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ctrlf-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus
    networks:
      - ctrlf-net

  # =============================================================================
  # Grafana (Dashboard)
  # =============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: ctrlf-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - ctrlf-net

  # =============================================================================
  # Kibana (Log Visualization)
  # =============================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: ctrlf-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://ctrlf-elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ctrlf-net

# =============================================================================
# Network
# =============================================================================
networks:
  ctrlf-net:
    driver: bridge
    name: ctrlf-network
