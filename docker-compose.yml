# =============================================================================
# ctrlf-ai Docker Compose 설정
# =============================================================================
#
# 사용법:
#   docker compose up -d
#
# 필수 환경변수 설정 (.env 파일 또는 export):
#   RAGFLOW_BASE_URL_REAL=http://ragflow-server:8080
#   LLM_BASE_URL_REAL=http://llm-server:8001
#   BACKEND_BASE_URL_REAL=http://backend-server:8080
#   RAGFLOW_API_KEY=your-api-key
#   OPENAI_API_KEY=your-openai-key
#
# 보안 토큰 (프로덕션 필수):
#   BACKEND_INTERNAL_TOKEN=your-internal-token
#   AI_CALLBACK_TOKEN=your-callback-token
#   BACKEND_SERVICE_TOKEN=your-service-token
#   BACKEND_API_TOKEN=your-api-token
#
# =============================================================================

services:
  # =============================================================================
  # AI Gateway (ctrlf-ai)
  # =============================================================================
  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctrlf-ai-gateway
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ctrlf-ai-gateway
      - APP_ENV=docker
      - LOG_LEVEL=DEBUG
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    networks:
      - ctrlf-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  # =============================================================================
  # Elasticsearch
  # =============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: ctrlf-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    networks:
      - ctrlf-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5


  # =============================================================================
  # Kibana
  # =============================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: ctrlf-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://ctrlf-elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - ctrlf-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  # =============================================================================
  # Prometheus
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ctrlf-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus
    networks:
      - ctrlf-net

  # =============================================================================
  # Grafana  ✅ (여기로 와야 함)
  # =============================================================================
  grafana:
    image: grafana/grafana:10.2.3
    container_name: ctrlf-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - ctrlf-net
    depends_on:
      - prometheus

# =============================================================================
# 네트워크
# =============================================================================
networks:
  ctrlf-net:
    driver: bridge
    name: ctrlf-network

# =============================================================================
# 볼륨 (맨 아래)
# =============================================================================
volumes:
  grafana-data:


