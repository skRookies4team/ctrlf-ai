# =============================================================================
# ctrlf-ai Docker Compose 설정
# Phase 8: Docker Compose 통합 테스트 환경
# Phase 9: mock/real 모드 프로필 지원
# =============================================================================
#
# 사용법:
#   Mock 모드 (기본값, 통합 테스트용):
#     docker compose --profile mock up -d
#     pytest -m integration -v
#
#   Real 모드 (실제 서비스 연동):
#     export RAGFLOW_BASE_URL_REAL=http://real-ragflow:8080
#     export LLM_BASE_URL_REAL=http://real-llm:8001
#     export BACKEND_BASE_URL_REAL=http://real-backend:8080
#     docker compose --profile real up -d
#     pytest -m real_integration -v
#
# =============================================================================

version: "3.8"

services:
  # =============================================================================
  # AI Gateway (ctrlf-ai) - 베이스 서비스 (직접 실행 X, extends용)
  # Mock/Real 프로필에서 상속받아 사용
  # =============================================================================
  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_NAME=ctrlf-ai-gateway
      - APP_ENV=docker
      - LOG_LEVEL=DEBUG
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - AI_ENV=${AI_ENV:-mock}
      - RAGFLOW_BASE_URL_MOCK=http://ragflow:8080
      - LLM_BASE_URL_MOCK=http://llm-internal:8001
      - BACKEND_BASE_URL_MOCK=http://backend-mock:8081
      - RAGFLOW_BASE_URL_REAL=${RAGFLOW_BASE_URL_REAL:-}
      - LLM_BASE_URL_REAL=${LLM_BASE_URL_REAL:-}
      - BACKEND_BASE_URL_REAL=${BACKEND_BASE_URL_REAL:-}
      - PII_BASE_URL=
      - PII_ENABLED=true
      - BACKEND_INTERNAL_TOKEN=${BACKEND_INTERNAL_TOKEN:-ctrlf-b2a-x7k9m2p4q8r1}
      - RAGFLOW_CALLBACK_TOKEN=${RAGFLOW_CALLBACK_TOKEN:-ctrlf-r2a-w3e5t7y9u2i4}
      - BACKEND_SERVICE_TOKEN=${BACKEND_SERVICE_TOKEN:-ctrlf-a2b-z6x8c1v3b5n7}
      - BACKEND_API_TOKEN=${BACKEND_API_TOKEN:-ctrlf-a2b-h4j6k8l0m2n4}

    networks:
      - ctrlf-net

    depends_on:   # 🔥 이게 핵심
      elasticsearch:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================================
  # AI Gateway - Mock 프로필 전용
  # Mock 서비스 의존성이 있는 버전
  # =============================================================================
  ai-gateway-mock:
    extends:
      service: ai-gateway
    container_name: ctrlf-ai-gateway-mock
    ports:
      - "8000:8000"
    profiles:
      - mock
    environment:
      - AI_ENV=mock
      - MILVUS_ENABLED=true
      - RAGFLOW_BASE_URL_MOCK=http://ragflow:8080
      - LLM_BASE_URL_MOCK=http://llm-internal:8001
      - BACKEND_BASE_URL_MOCK=http://backend-mock:8081
    depends_on:
      ragflow:
        condition: service_healthy
      llm-internal:
        condition: service_healthy
      backend-mock:
        condition: service_healthy

  # =============================================================================
  # AI Gateway - Real 프로필 전용
  # 외부 서비스에 직접 연결 (Mock 서비스 의존성 없음)
  # =============================================================================
  ai-gateway-real:
    extends:
      service: ai-gateway
    container_name: ctrlf-ai-gateway-real
    ports:
      - "8000:8000"
    profiles:
      - real
    environment:
      - AI_ENV=real
      # Milvus 설정
      - MILVUS_ENABLED=${MILVUS_ENABLED:-true}
      - MILVUS_HOST=${MILVUS_HOST:-58.127.241.84}
      - MILVUS_PORT=${MILVUS_PORT:-19540}
      - MILVUS_COLLECTION_NAME=${MILVUS_COLLECTION_NAME:-ragflow_chunks}
      - MILVUS_SEARCH_PARAMS={"metric_type":"L2","params":{"nprobe":10}}
      # OpenAI 임베딩 설정 (text-embedding-3-large, 3072차원)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBED_MODEL=${OPENAI_EMBED_MODEL:-text-embedding-3-large}
      - OPENAI_EMBED_DIM=${OPENAI_EMBED_DIM:-3072}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-3072}
      # Real URL은 반드시 외부에서 환경변수로 설정해야 함
      - RAGFLOW_BASE_URL_REAL=${RAGFLOW_BASE_URL_REAL:?RAGFLOW_BASE_URL_REAL must be set for real mode}
      - LLM_BASE_URL_REAL=${LLM_BASE_URL_REAL:?LLM_BASE_URL_REAL must be set for real mode}
      - BACKEND_BASE_URL_REAL=${BACKEND_BASE_URL_REAL:?BACKEND_BASE_URL_REAL must be set for real mode}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://58.127.241.84:1237}

    # Real 모드에서는 Mock 서비스 의존성 없음

  # =============================================================================
  # Mock RAGFlow 서비스 - RAG 검색 API (Mock 프로필 전용)
  # =============================================================================
  ragflow:
    build:
      context: ./mock_ragflow
      dockerfile: Dockerfile
    container_name: ctrlf-mock-ragflow
    profiles:
      - mock
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=DEBUG
    networks:
      - ctrlf-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # =============================================================================
  # Mock LLM 서비스 - 내부 LLM HTTP API (Mock 프로필 전용)
  # =============================================================================
  llm-internal:
    build:
      context: ./mock_llm
      dockerfile: Dockerfile
    container_name: ctrlf-mock-llm
    profiles:
      - mock
    ports:
      - "8001:8001"
    environment:
      - LOG_LEVEL=DEBUG
    networks:
      - ctrlf-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # =============================================================================
  # Mock Backend 서비스 - AI 로그 수집 API (Mock 프로필 전용)
  # =============================================================================
  backend-mock:
    build:
      context: ./mock_backend
      dockerfile: Dockerfile
    container_name: ctrlf-mock-backend
    profiles:
      - mock
    ports:
      - "8081:8081"
    environment:
      - LOG_LEVEL=DEBUG
    networks:
      - ctrlf-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: ctrlf-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    networks:
      - ctrlf-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: ctrlf-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://ctrlf-elasticsearch:9200
      - SERVER_NAME=ctrlf-kibana
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    networks:
      - ctrlf-net
    depends_on:
      elasticsearch:
        condition: service_healthy

# =============================================================================
# 네트워크 설정
# =============================================================================
networks:
  ctrlf-net:
    driver: bridge
    name: ctrlf-network
