# =============================================================================
# ctrlf-ai Docker Compose 설정
# =============================================================================
#
# 사용법:
#   docker compose up -d
#
# 필수 환경변수 설정:
#   export RAGFLOW_BASE_URL_REAL=http://ragflow-server:8080
#   export LLM_BASE_URL_REAL=http://llm-server:8001
#   export BACKEND_BASE_URL_REAL=http://backend-server:8080
#   export RAGFLOW_API_KEY=your-api-key
#   export OPENAI_API_KEY=your-openai-key
#
# =============================================================================

services:
  # =============================================================================
  # AI Gateway (ctrlf-ai)
  # =============================================================================
  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctrlf-ai-gateway
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ctrlf-ai-gateway
      - APP_ENV=docker
      - LOG_LEVEL=DEBUG
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # Milvus 설정
      - MILVUS_ENABLED=${MILVUS_ENABLED:-true}
      - MILVUS_HOST=${MILVUS_HOST:-58.127.241.84}
      - MILVUS_PORT=${MILVUS_PORT:-19540}
      - MILVUS_COLLECTION_NAME=${MILVUS_COLLECTION_NAME:-ragflow_chunks_openai}
      - MILVUS_SEARCH_PARAMS={"metric_type":"L2","params":{"nprobe":10}}
      # OpenAI 임베딩 설정 (text-embedding-3-large, 3072차원)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBED_MODEL=${OPENAI_EMBED_MODEL:-text-embedding-3-large}
      - OPENAI_EMBED_DIM=${OPENAI_EMBED_DIM:-3072}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-3072}
      # 외부 서비스 URL
      - RAGFLOW_BASE_URL_REAL=${RAGFLOW_BASE_URL_REAL}
      - LLM_BASE_URL_REAL=${LLM_BASE_URL_REAL}
      - BACKEND_BASE_URL_REAL=${BACKEND_BASE_URL_REAL}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localhost:1237}
      # Phase 57 테스트: anchor_gate 완화
      - RAG_QUALITY_HARD_DROP_ENABLED=${RAG_QUALITY_HARD_DROP_ENABLED:-false}
      # Phase 58: Quality Gate 설정
      - RAG_QUALITY_DISTANCE_GATE_ENABLED=${RAG_QUALITY_DISTANCE_GATE_ENABLED:-true}
      - RAG_QUALITY_L2_WARN=${RAG_QUALITY_L2_WARN:-1.4}
      - RAG_QUALITY_L2_REJECT=${RAG_QUALITY_L2_REJECT:-1.6}

      - RAGFLOW_API_KEY=${RAGFLOW_API_KEY:?RAGFLOW_API_KEY must be set for real mode}
      # BACKEND_INTERNAL_TOKEN은 RAGFlow 서버의 AI_TO_RAGFLOW_TOKEN과 일치해야 함
      # RAGFlow 서버는 AI_TO_RAGFLOW_TOKEN=${RAGFLOW_API_KEY}로 설정되어 있음
      # 코드에서 BACKEND_INTERNAL_TOKEN이 없으면 RAGFLOW_API_KEY를 사용하도록 처리됨
      # 인증 토큰
      - BACKEND_INTERNAL_TOKEN=${BACKEND_INTERNAL_TOKEN:-}
      - AI_CALLBACK_TOKEN=${AI_CALLBACK_TOKEN:-ctrlf-r2a-w3e5t7y9u2i4}
      - BACKEND_SERVICE_TOKEN=${BACKEND_SERVICE_TOKEN:-ctrlf-a2b-z6x8c1v3b5n7}
      - BACKEND_API_TOKEN=${BACKEND_API_TOKEN:-ctrlf-a2b-h4j6k8l0m2n4}
      # PII 설정
      - PII_BASE_URL=
      - PII_ENABLED=true
      # RouterOrchestrator 활성화
      - ROUTER_ORCHESTRATOR_ENABLED=true
      # 개인화 모드: auto (백엔드 시도 후 실패시 fallback), real (백엔드 필수)
      - PERSONALIZATION_MODE=${PERSONALIZATION_MODE:-auto}
      # HeyGen 영상 생성 설정
      - HEYGEN_API_KEY=${HEYGEN_API_KEY:-}
      - HEYGEN_AVATAR_ID=${HEYGEN_AVATAR_ID:-}
      - HEYGEN_VOICE_ID=${HEYGEN_VOICE_ID:-}
      # AWS S3 설정 (boto3 직접 업로드용, presign 사용 금지)
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_S3_REGION=${AWS_S3_REGION:-ap-northeast-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      # Storage 설정
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-s3}
      - STORAGE_PUBLIC_BASE_URL=${STORAGE_PUBLIC_BASE_URL:-}
    networks:
      - ctrlf-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================================
  # Elasticsearch - 로그 저장소
  # =============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: ctrlf-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    networks:
      - ctrlf-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Kibana - 로그 시각화
  # =============================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: ctrlf-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://ctrlf-elasticsearch:9200
      - SERVER_NAME=ctrlf-kibana
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    networks:
      - ctrlf-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  # =============================================================================
  # Prometheus - 메트릭 수집
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ctrlf-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus
    networks:
      - ctrlf-net

  # =============================================================================
  # Grafana - 메트릭 시각화
  # =============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: ctrlf-grafana
    ports:
      - "3000:3000"
    networks:
      - ctrlf-net
    depends_on:
      - prometheus

# =============================================================================
# 네트워크 설정
# =============================================================================
networks:
  ctrlf-net:
    driver: bridge
    name: ctrlf-network
